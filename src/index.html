<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <title>elbe/ui - Angular UI components built with Tailwind CSS and spartan/ui</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Tints the iOS Safari address bar / safe areas; kept in sync below. -->
    <meta name="theme-color" content="#ffffff" />

    <link rel="canonical" href="https://elbe-ui.dev" />
    <link rel="sitemap" href="/sitemap.xml" />

    <meta
      name="description"
      content="Angular UI components built with Tailwind CSS and spartan/ui"
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:title" content="elbe/ui" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:description"
      content="Angular UI components built with Tailwind CSS and spartan/ui"
    />
    <meta property="og:site_name" content="elbe/ui" />

    <meta name="twitter:title" content="elbe/ui" />
    <meta
      name="twitter:description"
      content="Angular UI components built with Tailwind CSS and spartan/ui"
    />

    <script async src="https://analytics.notiz.dev/js/pa-iQ93eDFoRcZWfFYe3-Vi5.js"></script>
    <script>
      ((window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        }),
        (plausible.init =
          plausible.init ||
          function (i) {
            plausible.o = i || {};
          }));
      plausible.init();
    </script>

    <!-- Prevent flash of wrong theme before Angular bootstraps (GitHub Pages). -->
    <style>
      :root { color-scheme: light; background-color: #ffffff; }
      .dark { color-scheme: dark; background-color: #0a0a0a; }
    </style>

    <script>
      if (typeof window !== 'undefined' && typeof document !== 'undefined') {
        const theme = localStorage.getItem('theme');

        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        // Match the iOS browser chrome to the resolved theme before first paint.
        const isDark = document.documentElement.classList.contains('dark');
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute('content', isDark ? '#0a0a0a' : '#ffffff');
        }
      }
    </script>
  </head>
  <body class="bg-background text-foreground [--header-height:--spacing(14)]">
    <app-root></app-root>
  </body>
</html>
